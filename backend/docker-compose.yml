version: "3.9"

services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: testvixdocker
      POSTGRES_USER: testvixdocker
      POSTGRES_PASSWORD: qoty_qouy_2006
    volumes:
      - pgdata:/var/lib/postgresql/data



  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6380:6379"
      - "8014:8001"
    volumes:
      - redisdata:/data
    env_file:
      - .env

  account:
    build: ./fastapi_account
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      - redis

  testlar:
    build: ./fastapi_testlar
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    depends_on:
      - redis
    env_file:
      - .env

  savollar:
    build: ./fastapi_savollar
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    depends_on:
      - redis
  
  frontend:
    build: ../frontend/TestVix
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/TestVix:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true


  celery:
    build: ./fastapi_testlar
    container_name: celery_worker
    command: celery -A celery_app worker -P solo -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - testlar
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - .env
  
  # app:
  #   build: .
  #   env_file: .env
    # ports:
    #   - "8000:8000"
  # django:
  #   build: ./django_main
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:
  redisdata: