version: "3.9"

networks:
  testvix-network:
    driver: bridge

services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: testvixdocker
      POSTGRES_USER: testvixdocker
      POSTGRES_PASSWORD: qoty_qouy_2006
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testvixdocker -d testvixdocker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - testvix-network


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - account
      - testlar
      - savollar
      - comment
    networks:
      - testvix-network

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6380:6379"
      - "8014:8001"
    volumes:
      - redisdata:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - testvix-network

  account:
    build: ./fastapi_account
    volumes:
      - .:/app
    expose:
      - "8000"
    # ports:
    #   - "8001:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - testvix-network

  testlar:
    build: ./fastapi_testlar
    volumes:
      - .:/app
    expose:
      - "8000"
    # ports:
    #   - "8002:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - testvix-network

  savollar:
    build: ./fastapi_savollar
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    expose:
      - "8000"
    # ports:
    #   - "8003:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - testvix-network
  
  comment:
    build: ./fastapi_comment
    volumes:
      - .:/app
    expose:
      - "8000"
    # ports:
    #   - "8004:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - testvix-network
  
  frontend:
    build: ../frontend/TestVix
    expose:
      - "5173"
    # ports:
    #   - "5173:5173"
    volumes:
      - ../frontend/TestVix:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - testvix-network


  celery:
    build: ./fastapi_testlar
    container_name: celery_worker
    command: celery -A celery_app worker -P solo -l info
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started
      testlar:
        condition: service_started
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - .env
    networks:
      - testvix-network

  # Locust Master
  locust-master:
    image: locustio/locust
    ports:
      - "8089:8089"
    command: -f /locust/locustfile.py --master --host=http://nginx
    volumes:
      - ./locustfile.py:/locust/locustfile.py
    depends_on:
      - nginx
    networks:
      - testvix-network
    profiles:
      - loadtest  # Faqat shu profile bilan ishga tushadi

  # Locust Worker (bir nechta qo'shishingiz mumkin)
  locust-worker:
    image: locustio/locust
    command: -f /locust/locustfile.py --worker --master-host=locust-master
    volumes:
      - ./locustfile.py:/locust/locustfile.py
    depends_on:
      - locust-master
    networks:
      - testvix-network
    deploy:
      replicas: 2  # 2 ta worker, ko'paytirishingiz mumkin
    profiles:
      - loadtest  # Faqat shu profile bilan ishga tushadi
  
  # app:
  #   build: .
  #   env_file: .env
    # ports:
    #   - "8000:8000"
  # django:
  #   build: ./django_main
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:
  redisdata: