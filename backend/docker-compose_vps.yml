services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: testvixdocker
      POSTGRES_USER: testvixdocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: unless-stopped
    volumes:
      - redisdata:/data
    env_file:
      - .env

  account:
    build: ./fastapi_account
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8101:8000"
    depends_on:
      - redis

  testlar:
    build: ./fastapi_testlar
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8102:8000"
    depends_on:
      - redis
    env_file:
      - .env

  savollar:
    build: ./fastapi_savollar
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8103:8000"
    depends_on:
      - redis

  frontend:
    build: ../frontend/TestVix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:80"

  celery:
    build: ./fastapi_testlar
    container_name: celery_worker
    restart: unless-stopped
    command: celery -A celery_app worker -P solo -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - testlar
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - .env

volumes:
  pgdata:
  redisdata: