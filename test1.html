<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Inter, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8fafc;
    padding:20px;
}

.logout-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:24px;
    padding:40px 35px;
    text-align:center;
    border:1px solid #eef2f7;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
}

.icon-wrapper{
    width:72px;
    height:72px;
    margin:0 auto 24px;
    border-radius:50%;
    background:#fff1f2;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-wrapper i{
    font-size:32px;
    color:#e11d48;
}

h2{
    color:#0f172a;
    font-size:26px;
    font-weight:700;
    margin-bottom:12px;
}

p{
    color:#64748b;
    font-size:15px;
    line-height:1.7;
    margin-bottom:30px;
}

.actions{
    display:flex;
    gap:12px;
}

.btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.btn-cancel{
    background:#f1f5f9;
    color:#475569;
}

.btn-cancel:hover{
    background:#e2e8f0;
}

.btn-logout{
    background:#0f172a;
    color:white;
}

.btn-logout:hover{
    background:#1e293b;
    transform:translateY(-2px);
}

.note{
    margin-top:20px;
    font-size:13px;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="logout-box">

    <div class="icon-wrapper">
        <i class="bi bi-box-arrow-right"></i>
    </div>

    <h2>Tizimdan chiqish</h2>

    <p>
        Sessiyangiz yakunlanadi. Davom etishdan oldin,
        akkauntingizdan chiqishni tasdiqlang.
    </p>

    <div class="actions">
        <button class="btn btn-cancel" onclick="history.back()">
            Qolish
        </button>

        <button class="btn btn-logout" onclick="logout()">
            Chiqish
        </button>
    </div>

    <div class="note">
        <i class="bi bi-shield-check"></i>
        Hisobingiz ma'lumotlari saqlanib qoladi.
    </div>

</div>

<script>
function logout(){
    // Logout logikasi
    window.location.href = "login.html";
}
</script>

</body>
</html>
